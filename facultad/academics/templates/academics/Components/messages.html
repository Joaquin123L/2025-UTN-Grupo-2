{% if messages %}
  <div class="ap-messages" id="ap-messages">
    {% for message in messages %}
      <div class="ap-msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>

  <script>
    // Espera 3 segundos y luego desvanece el contenedor
    setTimeout(() => {
      const container = document.getElementById("ap-messages");
      if (container) {
        container.style.transition = "opacity 0.8s ease";
        container.style.opacity = "0";
        setTimeout(() => container.remove(), 800); // se elimina del DOM
      }
    }, 3000); // 3 segundos visible
  </script>

  <style>
    .ap-messages {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .ap-msg {
      background: #f4f4f4;
      border-left: 4px solid #999;
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 4px;
      font-family: sans-serif;
      color: #333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .ap-msg.success {
      background: #d1f7d1;
      border-color: #28a745;
    }

    .ap-msg.error {
      background: #f8d7da;
      border-color: #dc3545;
    }

    .ap-msg.warning {
      background: #fff3cd;
      border-color: #ffc107;
    }

    .ap-msg.info {
      background: #cce5ff;
      border-color: #007bff;
    }
  </style>
{% endif %}
